 var r=srand(L*977+w*131+7+(endless?5000:0));var p=pool(endless?Math.min(11,L+((w/3)|0)):L);
 var B=(BAL.B0+BAL.B1*w+BAL.B2*w*w)*(1+BAL.LV*L);if(endless)B*=1+0.04*w;
 if(!endless&&LV[L].boss&&w===n-1)B*=.55;
 var hpM=1+BAL.HP*L+(endless?0.08*w:0.02*w);
 var k=1+(w>1?1:0)+(w>5?1:0),g=[],t=0,np=LV[L].p.length;
 if(w<3&&!endless)p=p.filter(function(t){return ED[t].c<8;});
 for(var i=0;i<k;i++){var ty=(w<2&&i===0)?p[w%2]:p[Math.floor(r()*p.length)];
  if(i===k-1&&w>=3&&r()<.5)ty=p[p.length-1];
  var cnt=Math.max(1,Math.round(B/k/ED[ty].c));if(ED[ty].c>=8)cnt=Math.min(cnt,1+((w/3)|0));var iv=ty==='runner'?.55:(ED[ty].c>=8?2.2:.9);
  g.push({ty:ty,cnt:cnt,iv:iv,t0:t,path:(i+w)%np,hpM:hpM});t+=cnt*iv*0.55+1.5;}

 if(boss)g.push({ty:boss,cnt:1,iv:1,t0:t*0.5+3,path:0,hpM:endless?1+0.1*w:1});

 var cv2=AC.createConvolver();cv2.buffer=impulse(2.4);var rg=AC.createGain();rg.gain.value=.4;cv2.connect(rg);rg.connect(comp);revIn=cv2;

  if(s===0){[0,7,12].forEach(function(iv,k){var o=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter();o.type='sawtooth';o.frequency.value=D/2*Math.pow(2,(iv+root)/12)*(1+k*.002);f.type='lowpass';f.frequency.value=520;
   g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.07,t+1.4);g.gain.exponentialRampToValueAtTime(.0001,t+spb*32+.5);o.connect(f);f.connect(g);g.connect(musG);var rs=AC.createGain();rs.gain.value=.5;g.connect(rs);rs.connect(revIn);o.start(t);o.stop(t+spb*32+.6);});}

function mkPath(pts){var segs=[],cum=0;for(var i=0;i<pts.length-1;i++){var a=pts[i],b=pts[i+1],dx=b[0]-a[0],dy=b[1]-a[1],l=Math.sqrt(dx*dx+dy*dy);segs.push({x:a[0],y:a[1],dx:dx/l,dy:dy/l,l:l,c:cum});cum+=l;}
 var P={pts:pts,segs:segs,len:cum};P.samp=[];for(var d=0;d<=cum;d+=12){var q=posAt(P,d,0);P.samp.push(q);}return P;}
function posAt(P,d,off){var s=P.segs,i=0;if(d<=0)i=0;else{for(i=0;i<s.length-1;i++)if(d<s[i].c+s[i].l)break;}var g=s[i],t=clamp(d-g.c,-50,g.l+200);
 return {x:g.x+g.dx*t-g.dy*(off||0),y:g.y+g.dy*t+g.dx*(off||0),dx:g.dx,dy:g.dy};}
function nearPath(paths,x,y){var best=1e9,bp=null;for(var k=0;k<paths.length;k++){var s=paths[k].samp;for(var i=0;i<s.length;i++){var d=dst(x,y,s[i].x,s[i].y);if(d<best){best=d;bp={p:k,d:i*12,x:s[i].x,y:s[i].y};}}}if(bp)bp.dist=best;return bp;}
function genSpots(paths,seed){var sp=[],r=srand(seed);
 for(var k=0;k<paths.length;k++){var P=paths[k];for(var d=80;d<P.len-60;d+=64){[1,-1].forEach(function(sd){var q=posAt(P,d,sd*(66+r()*10));var x=q.x,y=q.y;
  if(x<46||x>674||y<110||y>960)return;var np=nearPath(paths,x,y);if(np.dist<54)return;
  for(var j=0;j<sp.length;j++)if(dst(x,y,sp[j].x,sp[j].y)<104)return;if(sp.length>=14)return;sp.push({x:Math.round(x),y:Math.round(y)});});}}
 return sp;}

 var h=S.hero;if(!h.dead&&dst(x,y,h.x,h.y-20)<30){S.aim='hero';S.sel={hero:1};noInfo();sfx('click');return;}

 S.sel=null;S.pend=null;noInfo();}

 if(ok){S.sel=null;S.pend=null;noInfo();}}

 if(S.mode==='endless'){var wv=S.lastWave+1;endRew=Math.floor(wv/2);if(wv>(save.endl[i]||0)){save.endl[i]=wv;msg=L.best+' ';}msg+=L.reached+wv;}
 else if(win){st=S.lives>=18?3:S.lives>=10?2:1;if(S.mode==='chal'){st=3;endRew=save.chal[i]?5:20;if(!save.chal[i])msg=L.chalWin;save.chal[i]=1;}else{endRew=st*5;if(st>(save.stars[i]||0))save.stars[i]=st;}save.tut=1;}
 else endRew=0;

  $('bEnNext').textContent=L.next;$('bEnNext').classList.toggle('hide',!(win&&S.mode==='camp'&&i<11));$('bEnRetry').textContent=L.retry;},win?1100:900);}

 if(state==='play'&&S){var n=S.spd,st=dt*n/Math.ceil(n);for(var k=0;k<Math.ceil(n);k++)update(st);}

 bot:function(Lv,mode,skill){startGame(Lv,mode||'camp');var s=S,plan=['barracks','archer','mage','artillery','archer','barracks','mage','artillery'];
  var spots=s.spots.slice().map(function(p){var cnt=0;s.paths.forEach(function(P){P.samp.forEach(function(q){if(dst(q.x,q.y,p.x,p.y)<150)cnt++;});});return {p:p,c:cnt};}).sort(function(a,b){return b.c-a.c;});
  var n=0,steps=0;callWave(false);
  while(!s.over&&steps<60000){steps++;
   if(steps%10===0){if(skill>0){var free=spots.filter(function(x){return !x.p.t;});var nt=plan[n%plan.length];var cap=skill>1?Math.min(spots.length,4+s.wave):Math.min(spots.length,3+s.wave);
     if(free.length&&s.towers.length<cap){if(s.gold>=TD[nt].cost[0]){build(free[0].p,nt);n++;}}
     else{var tw=s.towers.filter(function(t){return t.lv<(skill>1?5:3);}).sort(function(a,b){return a.lv-b.lv;})[0];if(tw&&s.gold>=upCost(tw))upgrade(tw,tw.lv===3?(n++%2?'A':'B'):null);}
     if(skill>1){if(s.cd.met<=0&&s.enemies.length>4){var e=s.enemies.slice().sort(function(a,b){return b.d-a.d;})[0];castSpell('met',e.x,e.y);}if(s.cd.rei<=0&&s.enemies.length>2){var e2=s.enemies.slice().sort(function(a,b){return b.d-a.d;})[0];castSpell('rei',e2.x,e2.y);}if(s.cd.a1<=0&&s.enemies.some(function(e){return dst(e.x,e.y,s.hero.x,s.hero.y)<80;}))heroAbility('a1');}}
    else{if(s.towers.length<2&&s.gold>=70)build(spots[s.towers.length].p,'archer');}}
   if(s.wave!==s._lw){s._lw=s.wave;(s.log=s.log||[]).push(s.wave+':'+s.lives+'/'+s.gold+'/'+s.towers.map(function(t){return t.lv;}).join(''));}update(1/20);}
